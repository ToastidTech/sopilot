<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>SOPilot | Toastid Tech</title>

<style>
:root{
  --bg:#070A12;
  --panel:rgba(18,24,40,0.55);
  --stroke:rgba(80,170,255,0.25);
  --blue:#3aa0ff;
  --blue2:#66d1ff;
  --text:#eaf2ff;
  --muted:#8ea2c0;
}

*{
  box-sizing:border-box;
  font-family:system-ui,Segoe UI,Roboto,Arial;
}

body{
  margin:0;
  background: radial-gradient(circle at top, #0d1a33, var(--bg));
  color:var(--text);
}

/* BACKGROUND ORBS */
.bg-orb{
  position:fixed;
  width:600px;
  height:600px;
  background: radial-gradient(circle, rgba(58,160,255,0.25), transparent 60%);
  filter: blur(40px);
  z-index:0;
}
.orb1{ top:-200px; left:-200px; }
.orb2{ bottom:-200px; right:-200px; }

/* HEADER */
header{
  position:sticky;
  top:0;
  z-index:10;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:12px 16px;
  backdrop-filter: blur(18px);
  background: rgba(10,14,25,0.6);
  border-bottom:1px solid var(--stroke);
}

.toastid{
  display:flex;
  align-items:center;
  gap:10px;
  font-size:12px;
  opacity:0.7;
}

.sopilot{
  font-weight:700;
  letter-spacing:6px;
  color:var(--blue2);
  text-shadow:0 0 18px rgba(58,160,255,0.35);
}

.status{
  font-size:12px;
  color:var(--muted);
  border:1px solid var(--stroke);
  padding:6px 10px;
  border-radius:999px;
}

/* HERO */
.hero{
  text-align:center;
  padding:40px 20px 20px;
  position:relative;
}

.hero h1{
  margin:10px 0 5px;
  font-size:20px;
}

.hero p{
  color:var(--muted);
  font-size:13px;
}

/* CORE */
.container{
  max-width:900px;
  margin:auto;
  padding:20px;
  position:relative;
  z-index:2;
}

/* CARD */
.card{
  background:var(--panel);
  border:1px solid var(--stroke);
  border-radius:14px;
  padding:16px;
  margin-bottom:14px;
  backdrop-filter: blur(12px);
}

.card h3{
  margin:0 0 10px;
  color:var(--blue2);
}

/* INPUTS */
select, textarea, input{
  width:100%;
  padding:10px;
  margin-top:8px;
  border-radius:10px;
  border:1px solid var(--stroke);
  background:rgba(0,0,0,0.25);
  color:var(--text);
}

button{
  width:100%;
  padding:10px;
  margin-top:10px;
  border-radius:10px;
  border:none;
  cursor:pointer;
  background:linear-gradient(90deg,var(--blue),var(--blue2));
  color:white;
  font-weight:600;
}

button.secondary{
  background:transparent;
  border:1px solid var(--stroke);
  color:var(--blue2);
}

.output{
  margin-top:10px;
  font-size:13px;
  color:var(--muted);
  white-space:pre-wrap;
}
</style>
</head>

<body>

<div class="bg-orb orb1"></div>
<div class="bg-orb orb2"></div>

<header>
  <div class="toastid">TOASTID TECH</div>
  <div class="sopilot">SOPILOT</div>
  <div class="status" id="status">FREE MODE</div>
</header>

<div class="hero">
  <h1>Structured SOP Execution Engine</h1>
  <p>Select a SOP → Provide context → Generate output</p>
</div>

<div class="container">

  <!-- SOP SELECTOR -->
  <div class="card">
    <h3>SOP Selector</h3>
    <select id="sop">
      <option value="content">Content Creation SOP</option>
      <option value="marketing">Marketing SOP</option>
      <option value="client">Client Reply SOP</option>
      <option value="strategy">Strategy SOP</option>
      <option value="custom">Custom SOP</option>
    </select>
  </div>

  <!-- INPUT -->
  <div class="card">
    <h3>Input Context</h3>
    <textarea id="context" placeholder="Describe what you need..."></textarea>

    <button onclick="runSOP()">Generate SOP Output</button>
    <button class="secondary" onclick="saveKey()">Save BYOK Key (optional)</button>

    <input id="key" type="password" placeholder="BYOK API Key (optional)"/>
    <div class="output" id="out"></div>
  </div>

</div>

<script>
let apiKey = localStorage.getItem("apiKey") || null;

function saveKey(){
  const key = document.getElementById("key").value.trim();
  if(!key){
    alert("No key entered");
    return;
  }
  apiKey = key;
  localStorage.setItem("apiKey", key);
  alert("BYOK key saved");
}

function runSOP(){
  const sop = document.getElementById("sop").value;
  const context = document.getElementById("context").value;

  if(!context){
    document.getElementById("out").innerText = "Please enter context.";
    return;
  }

  let output =
`SOP TYPE: ${sop.toUpperCase()}

INPUT:
${context}

OUTPUT (SIMULATED):
- Step 1: Analyze request
- Step 2: Structure response
- Step 3: Execute workflow logic
`;

  if(apiKey){
    output += "\nBYOK: ENABLED (key stored locally)";
  } else {
    output += "\nBYOK: OFF";
  }

  document.getElementById("out").innerText = output;
}
</script>

</body>
</html>
